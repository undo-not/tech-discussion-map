name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Scan tracked public repository content
        working-directory: .
        run: node scripts/scan-public-repo.mjs
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run build
      - name: Check whitespace in the delivered diff
        working-directory: .
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check --root HEAD
          fi

  native-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native audio helper
        run: cmake -S native/windows-audio -B native/windows-audio/build -A x64
      - name: Build native audio helper
        run: cmake --build native/windows-audio/build --config Release
      - name: Test native state machine
        run: ctest --test-dir native/windows-audio/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: techmap-audio-windows-x64
          path: native/windows-audio/build/Release/techmap-audio.exe
          if-no-files-found: error
          retention-days: 7

  native-transcription:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned whisper.cpp worker
        run: cmake -S native/transcription -B native/transcription/build -A x64
      - name: Build local transcription worker
        run: cmake --build native/transcription/build --config Release
      - name: Test transcription protocol
        run: ctest --test-dir native/transcription/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: techmap-transcriber-windows-x64
          path: native/transcription/build/Release/techmap-transcriber.exe
          if-no-files-found: error
          retention-days: 7

  native-teams-captions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Teams caption capability probe
        run: cmake -S native/teams-captions -B native/teams-captions/build -A x64
      - name: Build Teams caption capability probe
        run: cmake --build native/teams-captions/build --config Release
      - name: Test content-free probe contract
        run: ctest --test-dir native/teams-captions/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: techmap-captions-windows-x64
          path: native/teams-captions/build/Release/techmap-captions.exe
          if-no-files-found: error
          retention-days: 7

  native-privacy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows privacy helper
        run: cmake -S native/privacy -B native/privacy/build -A x64
      - name: Build Windows privacy helper
        run: cmake --build native/privacy/build --config Release
      - name: Test ACL, DPAPI, and Credential Manager boundaries with synthetic data
        run: ctest --test-dir native/privacy/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: techmap-privacy-windows-x64
          path: native/privacy/build/Release/techmap-privacy.exe
          if-no-files-found: error
          retention-days: 7

  launcher-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-command MVP launcher without capture or runtime dependencies
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/preflight-mvp.ps1 -ContractOnly
