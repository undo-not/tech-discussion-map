name: Windows portable package

on:
  pull_request:
    paths:
      - '.github/workflows/portable-windows.yml'
      - 'TechMapLive.cmd'
      - 'app/**'
      - 'companion/**'
      - 'docs/adr/0009-windows-portable-runtime.md'
      - 'docs/specs/windows-portable-distribution.md'
      - 'native/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-windows.yml'
      - 'TechMapLive.cmd'
      - 'app/**'
      - 'companion/**'
      - 'docs/adr/0009-windows-portable-runtime.md'
      - 'docs/specs/windows-portable-distribution.md'
      - 'native/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install locked web dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build and test production application and native helpers
        shell: powershell
        run: |
          $env:TECHMAP_STANDALONE_BUILD = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-mvp.ps1 -SkipDependencyInstall
      - name: Reject dynamic Visual C++ runtime dependencies
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-native-portability.ps1
      - name: Build pinned static OCR runtime
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-tesseract-runtime.ps1 -OutputDirectory "$env:RUNNER_TEMP\techmap-ocr-runtime"
      - name: Assemble allowlisted portable directory
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-portable-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP\portable\TechMapLive" -OcrRuntimeDirectory "$env:RUNNER_TEMP\techmap-ocr-runtime"
      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -LiteralPath "$env:RUNNER_TEMP\portable\TechMapLive" -DestinationPath "$env:RUNNER_TEMP\TechMapLive-windows-x64.zip"
      - name: Verify ZIP on isolated LocalAppData and smoke-test loopback runtime
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-portable-package.ps1 -PackageZip "$env:RUNNER_TEMP\TechMapLive-windows-x64.zip"
      - name: Record distribution SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP\TechMapLive-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\TechMapLive-windows-x64.sha256", "$hash *TechMapLive-windows-x64.zip`n", [Text.Encoding]::ASCII)
          Write-Output "Portable ZIP SHA-256: $hash"
      - name: Upload ephemeral portable distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TechMapLive-windows-x64
          path: |
            ${{ runner.temp }}/TechMapLive-windows-x64.zip
            ${{ runner.temp }}/TechMapLive-windows-x64.sha256
          if-no-files-found: error
          retention-days: 14

  attest-portable:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-portable
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download distribution produced by the unprivileged build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TechMapLive-windows-x64
          path: '${{ runner.temp }}/portable'
      - name: Attest main distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/portable/TechMapLive-windows-x64.zip'
